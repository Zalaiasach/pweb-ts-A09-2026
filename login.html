<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Antrian Rumah Sakit Ursula</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="dist/login.js" defer></script>
</head>
<body>
  <div class="login-card">
    <h2>Login Sistem Antrian</h2>
    <p class="subtitle">Masukan Akun dan Password anda</p>

    <div id="error-alert" class="alert-error" style="display: none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Masuk</button>
    </form>

    <p class="hint-text">
      Layanan Terpadu Rumah Sakit Ursula.
    </p>
  </div>
</body>
</html>
