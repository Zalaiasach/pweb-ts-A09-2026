<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="dist/login.js" defer></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-card">
        <h2>Login Sistem Antrian</h2>
        <p class="subtitle">Masuk sebagai admin, moderator, atau user.</p>

        <div id="error-alert" class="alert-error" style="display: none;"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
          </div>

          <button type="submit" id="btn-submit" class="btn-primary">Masuk</button>
        </form>

        <p class="hint-text">
          096, 067, 040
        </p>
      </div>
    </div>

    <!-- Bagian Kanan: Gambar Rumah Sakit & Branding -->
    <div class="login-right">
      <div class="image-overlay">
        <h3>Sistem Rumah Sakit</h3>
        <p>Pelayanan efisien, tertib, dan memprioritaskan kenyamanan pasien.</p>
      </div>
    </div>
  </div>
</body>
</html>
